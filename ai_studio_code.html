<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature I Ching ♡ 自然のエレメント占い</title>
    <style>
        /* 全体のデザイン */
        body {
            font-family: "Shippori Mincho", "Hiragino Mincho ProN", serif;
            background-color: #fffcf5;
            color: #5e4e4e;
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(#e6dfd1 1px, transparent 1px);
            background-size: 20px 20px;
        }

        h1 {
            font-size: 1.2rem;
            color: #d4a0a0;
            letter-spacing: 0.2em;
            margin-bottom: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(189, 173, 173, 0.15);
            width: 100%;
            max-width: 380px;
            border: 1px solid #f0e6d2;
            position: relative;
            overflow: hidden;
        }

        /* エレメント（絵）の表示エリア */
        .visual-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            position: relative;
            height: 160px;
        }

        /* 上下のアイコン枠 */
        .element-box {
            font-size: 3.5rem;
            line-height: 1.1;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,0.1));
            animation: bounceIn 0.8s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            position: relative;
            z-index: 2;
        }

        /* アイコン同士をつなぐ線（エネルギーの流れ） */
        .connector {
            width: 2px;
            height: 15px;
            background: #e0d4c3;
            margin: 2px 0;
        }

        .element-label {
            font-size: 0.7rem;
            color: #a89586;
            font-family: sans-serif;
            margin-bottom: 5px;
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            80% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 結果テキスト */
        #result-area { display: none; }

        .gua-name {
            font-size: 1rem;
            color: #a89586;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .gua-title {
            font-size: 1.5rem;
            font-weight: bold;
            color: #5e4e4e;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .gua-msg {
            font-size: 0.95rem;
            line-height: 1.8;
            text-align: left;
            margin-bottom: 20px;
            color: #6b5d5d;
        }

        .lucky-action {
            background-color: #fdfbf7;
            padding: 15px;
            border-radius: 15px;
            font-size: 0.9rem;
            color: #8a7575;
            text-align: center;
            border: 1px dashed #d4c4b5;
        }

        button {
            background-color: #d4a0a0;
            color: white;
            border: none;
            padding: 15px 50px;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(212, 160, 160, 0.4);
            font-family: sans-serif;
            letter-spacing: 0.05em;
        }

        button:hover {
            background-color: #c48b8b;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <h1>NATURE FORTUNE</h1>
    
    <div class="card">
        <div id="start-view">
            <p style="color:#888; line-height:1.8;">
                あなたの悩みは、<br>
                自然界のどんな風景に似ている？<br>
                <br>
                太陽、雨、山、雷...<br>
                2つのエレメントが答えを映し出します。
            </p>
            <button onclick="drawFortune()" style="margin-top:20px;">風景を映す</button>
        </div>

        <div id="result-area">
            <div class="visual-area" id="visual-container">
                <!-- ここにJSで絵文字が入ります -->
            </div>
            
            <div id="r-name" class="gua-name"></div>
            <div id="r-title" class="gua-title"></div>
            <div id="r-msg" class="gua-msg"></div>
            
            <div class="lucky-action">
                <b>♡ ラッキーアクション</b><br>
                <span id="r-action"></span>
            </div>
            
            <button onclick="reset()" style="margin-top:25px; background-color:#e6dfd1; color:#8a7575; padding:10px 30px; font-size:0.8rem;">もう一度</button>
        </div>
    </div>

            {n:"山水蒙", t:"霧の中の学び", m:"山のふもとに霧がかかっています。先が見えない時は、素直に先生や先輩に頼るのが正解。", a:"図書館・メンターへの相談"},

            {n:"坎為水", t:"荒波の中", m:"水が重なる深い谷。悩みが多いですが、水のように柔軟に流せば大丈夫です。", a:"水を飲む・お風呂"},
            {n:"離為火", t:"燃え上がる情熱", m:"炎が重なる情熱的な時。熱しやすく冷めやすいので、冷静さを忘れずに。", a:"キャンドル・アイメイク"},

            {n:"風雷益", t:"ボーナスタイム", m:"風と雷が勢いを増しています。何をしてもうまくいく利益の多い時。積極的に動いて！", a:"新しい文房具・投資"},

            {n:"火水未済", t:"まだ終わらない", m:"火と水が未完成の状態。でも可能性は無限大！ここから新しい物語が始まります。", a:"未来予想図・諦めない"}
        ];

        // 卦の名前からエレメントを解析して表示する関数
        function parseElements(name) {
            // 基本は漢字2文字（例：水雷）をとる
            let upperKey = name[0];
            let lowerKey = name[1];

            // 「〜為〜」のパターン（純卦）の場合の処理
            // 例：乾為天 -> 天・天
            if (name.includes('為')) {
                // '為'の次の文字を取得
                const elementChar = name[name.indexOf('為') + 1];
                upperKey = elementChar;
                lowerKey = elementChar;
            }

            return {
                upper: elements[upperKey],
                lower: elements[lowerKey]
            };
        }

        function drawFortune() {
            const resultArea = document.getElementById('result-area');
            const startView = document.getElementById('start-view');
            const visualContainer = document.getElementById('visual-container');
            
            // ランダム選択
            const randomIndex = Math.floor(Math.random() * iChingData.length);
            const result = iChingData[randomIndex];

            // エレメント解析
            const visuals = parseElements(result.n);
            
            // 描画（絵文字の生成）
            visualContainer.innerHTML = `
                <div class="element-box">
                    <div>${visuals.upper.icon}</div>
                    <div class="element-label">${visuals.upper.label}</div>
                </div>
                <div class="connector"></div>
                <div class="element-box">
                    <div>${visuals.lower.icon}</div>
                    <div class="element-label">${visuals.lower.label}</div>
                </div>
            `;

            // テキスト設定
            document.getElementById('r-name').innerText = "No." + (randomIndex + 1) + " " + result.n;
            document.getElementById('r-title').innerText = result.t;
            document.getElementById('r-msg').innerText = result.m;
            document.getElementById('r-action').innerText = result.a;

            // 画面切り替え
            startView.style.display = 'none';
            resultArea.style.display = 'block';
        }

        function reset() {
            document.getElementById('result-area').style.display = 'none';
            document.getElementById('start-view').style.display = 'block';
        }
    </script>

</body>
</html>
