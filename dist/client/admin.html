<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>予約管理｜ほしのキャンパス</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --night: #172d54;
      --pink: #c65b7b;
      --ink: #403b45;
      --soft: #746c75;
      --line: #eadce1;
      --cream: #fffaf7;
      --shadow: 0 18px 50px rgba(45,35,55,.09);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f9f5f7;
      color: var(--ink);
      font-family: "Zen Maru Gothic", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    .admin-header {
      position: sticky;
      z-index: 10;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 72px;
      padding: 12px max(20px, calc((100vw - 1180px) / 2));
      border-bottom: 1px solid var(--line);
      background: rgba(255,253,250,.94);
      backdrop-filter: blur(12px);
    }
    .brand {
      color: var(--night);
      font-family: "Shippori Mincho", serif;
      font-weight: 700;
      letter-spacing: .1em;
    }
    .brand small { display: block; color: var(--pink); font-family: "Zen Maru Gothic", sans-serif; font-size: .55rem; letter-spacing: .16em; }
    .admin-main { width: min(1180px, calc(100% - 32px)); margin: 32px auto 70px; }
    .admin-title { margin: 0; color: var(--night); font-family: "Shippori Mincho", serif; font-size: clamp(1.6rem, 4vw, 2.2rem); }
    .admin-sub { margin: 8px 0 24px; color: var(--soft); font-size: .86rem; }
    .panel {
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .login-panel { max-width: 520px; margin: 70px auto; text-align: center; }
    .login-panel h1 { color: var(--night); font-family: "Shippori Mincho", serif; }
    .login-row { display: flex; gap: 10px; margin-top: 20px; }
    input, select, textarea {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d9cbd0;
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 4px rgba(198,91,123,.11); }
    textarea { min-height: 84px; resize: vertical; line-height: 1.7; }
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 17px;
      border: 1px solid #d8cbd0;
      border-radius: 999px;
      background: #fff;
      color: var(--night);
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
    }
    .button.primary { border-color: var(--pink); background: var(--pink); color: #fff; }
    .button.ghost { background: transparent; }
    .admin-tools { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
    .admin-tools select { width: auto; min-width: 190px; }
    .reservation-list { display: grid; gap: 18px; }
    .reservation-card {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, .8fr);
      gap: 24px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    .reservation-id { color: var(--pink); font-size: .77rem; font-weight: 700; letter-spacing: .07em; }
    .reservation-card h2 { margin: 6px 0 14px; color: var(--night); font-family: "Shippori Mincho", serif; font-size: 1.25rem; }
    .reservation-meta { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 9px 18px; margin: 0; }
    .reservation-meta div { min-width: 0; }
    .reservation-meta dt { color: var(--soft); font-size: .7rem; }
    .reservation-meta dd { margin: 2px 0 0; overflow-wrap: anywhere; font-size: .84rem; }
    .topic { margin: 16px 0 0; padding: 14px 16px; border-radius: 14px; background: #fbf6f8; color: var(--soft); font-size: .8rem; line-height: 1.7; white-space: pre-wrap; }
    .editor { display: grid; gap: 12px; padding: 18px; border-radius: 18px; background: var(--cream); }
    .editor-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .editor label { display: grid; gap: 6px; color: var(--night); font-size: .75rem; font-weight: 700; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .status-message { margin: 14px 0 0; color: #a12f55; font-size: .8rem; text-align: center; }
    .empty { padding: 70px 20px; border: 1px dashed #d8cbd0; border-radius: 22px; color: var(--soft); text-align: center; }
    [hidden] { display: none !important; }
    @media (max-width: 820px) {
      .reservation-card { grid-template-columns: 1fr; }
      .reservation-meta { grid-template-columns: 1fr; }
    }
    @media (max-width: 520px) {
      .admin-main { width: min(100% - 20px, 1180px); margin-top: 20px; }
      .panel, .reservation-card { padding: 18px; border-radius: 18px; }
      .login-row, .editor-row { grid-template-columns: 1fr; flex-direction: column; }
      .admin-header { min-height: 64px; }
    }
  </style>
</head>
<body>
  <header class="admin-header">
    <div class="brand">ほしのキャンパス<small>RESERVATION ADMIN</small></div>
    <button class="button ghost" id="logout" type="button" hidden>ログアウト</button>
  </header>

  <main class="admin-main">
    <section class="panel login-panel" id="login-panel">
      <h1>予約管理</h1>
      <p>管理用パスワードを入力してください。</p>
      <form class="login-row" id="login-form">
        <input id="admin-token" type="password" autocomplete="current-password" required placeholder="管理用パスワード">
        <button class="button primary" type="submit">ログイン</button>
      </form>
      <p class="status-message" id="login-message"></p>
    </section>

    <section id="dashboard" hidden>
      <h1 class="admin-title">予約一覧</h1>
      <p class="admin-sub">入金確認、日程確定、Google Meet URLの登録、案内メールの作成をここで行えます。</p>
      <div class="admin-tools">
        <select id="status-filter" aria-label="予約状態で絞り込む">
          <option value="">すべての予約</option>
          <option value="provisional">仮予約</option>
          <option value="awaiting_payment">お支払い待ち</option>
          <option value="paid">入金確認済み</option>
          <option value="confirmed">予約確定</option>
          <option value="completed">実施済み</option>
          <option value="cancelled">キャンセル</option>
        </select>
        <button class="button" id="refresh" type="button">最新の状態に更新</button>
      </div>
      <div class="reservation-list" id="reservation-list"></div>
      <p class="status-message" id="dashboard-message"></p>
    </section>
  </main>

  <script>
    const statusLabels = {
      provisional: '仮予約・日程確認中',
      awaiting_payment: '日程確定・お支払い待ち',
      paid: '入金確認済み',
      confirmed: '予約確定',
      completed: '実施済み',
      cancelled: 'キャンセル'
    };
    const paymentLabels = { pending: '未確認', confirmed: '確認済み', refunded: '返金済み' };
    const serviceLabels = { fortune: '占い', career: 'キャリア相談' };
    const customerLabels = { student: '学生', working: '社会人' };
    const fortuneLabels = { iching: 'イーチンタロット', korean: '韓国占い', constellation: '星座推命' };
    let adminToken = sessionStorage.getItem('hoshino_admin_token') || '';
    const loginPanel = document.getElementById('login-panel');
    const dashboard = document.getElementById('dashboard');
    const list = document.getElementById('reservation-list');
    const loginMessage = document.getElementById('login-message');
    const dashboardMessage = document.getElementById('dashboard-message');
    const logout = document.getElementById('logout');

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
    }

    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        headers: {
          'authorization': `Bearer ${adminToken}`,
          ...(options.body ? { 'content-type': 'application/json' } : {}),
          ...(options.headers || {})
        }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || '処理できませんでした。');
      return data;
    }

    function mailLink(reservation) {
      const service = serviceLabels[reservation.service] || reservation.service;
      const subject = `【ほしのキャンパス】ご予約確定・オンラインセッションのご案内（${reservation.id}）`;
      const meeting = reservation.meeting_url || 'こちらにGoogle Meet URLを記載';
      const body = `${reservation.nickname}さん

このたびは、ほしのキャンパスへお申し込みいただきありがとうございます。
お支払いを確認し、以下の内容でご予約を確定しました。

【ご予約内容】
サービス：${service}
日時：${reservation.preferred_date} ${reservation.preferred_time}
所要時間：${reservation.duration}分

【オンライン通話】
Google Meetを使用します。
参加URL：${meeting}

開始時刻の5分前からアクセスできます。表示名は、ご予約時のニックネームで構いません。
URLを開いた後、「参加をリクエスト」を押してお待ちください。

当日はよろしくお願いいたします。

ほしのキャンパス`;
      return `mailto:${encodeURIComponent(reservation.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function paymentMailLink(reservation) {
      const service = serviceLabels[reservation.service] || reservation.service;
      const method = reservation.payment_method === 'bank' ? '銀行振込' : 'PayPay';
      const instructions = reservation.payment_method === 'bank'
        ? '銀行名・支店名・口座番号・口座名義をこちらに記載'
        : '正式な事業用PayPay決済のご案内をこちらに記載';
      const subject = `【ほしのキャンパス】日程とお支払いのご案内（${reservation.id}）`;
      const body = `${reservation.nickname}さん

このたびは、ほしのキャンパスへお申し込みいただきありがとうございます。
以下の日程でご案内できます。

【ご予約内容】
サービス：${service}
日時：${reservation.preferred_date} ${reservation.preferred_time}
所要時間：${reservation.duration}分
料金：${Number(reservation.amount).toLocaleString('ja-JP')}円（税込）

【お支払い方法】
${method}
${instructions}

お支払いを確認後、予約確定メールとGoogle Meetの参加URLをお送りします。
銀行振込の場合は、振込名義が表示される場合があります。

ほしのキャンパス`;
      return `mailto:${encodeURIComponent(reservation.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function reminderMailLink(reservation) {
      const service = serviceLabels[reservation.service] || reservation.service;
      const subject = `【明日のご予約】ほしのキャンパス オンラインセッション（${reservation.id}）`;
      const body = `${reservation.nickname}さん

明日は、ほしのキャンパスのオンラインセッション予約日です。

日時：${reservation.preferred_date} ${reservation.preferred_time}
サービス：${service}
参加URL：${reservation.meeting_url || 'こちらにGoogle Meet URLを記載'}

開始時刻の5分前からアクセスできます。
表示名は、ご予約時のニックネームで構いません。

明日はよろしくお願いいたします。

ほしのキャンパス`;
      return `mailto:${encodeURIComponent(reservation.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    }

    function calendarLink(reservation) {
      const start = new Date(`${reservation.preferred_date}T${reservation.preferred_time}:00+09:00`);
      const end = new Date(start.getTime() + reservation.duration * 60000);
      const format = date => date.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}Z$/, 'Z');
      const params = new URLSearchParams({
        action: 'TEMPLATE',
        text: `ほしのキャンパス：${reservation.nickname}さん`,
        dates: `${format(start)}/${format(end)}`,
        details: `受付番号：${reservation.id}\nメール：${reservation.email}\nGoogle Meet URLは予定作成時に追加してください。`
      });
      return `https://calendar.google.com/calendar/render?${params.toString()}`;
    }

    function renderReservations(reservations) {
      if (!reservations.length) {
        list.innerHTML = '<div class="empty">該当する予約はありません。</div>';
        return;
      }
      list.innerHTML = reservations.map(reservation => `
        <article class="reservation-card" data-id="${escapeHtml(reservation.id)}">
          <div>
            <div class="reservation-id">${escapeHtml(reservation.id)}・${escapeHtml(statusLabels[reservation.status] || reservation.status)}</div>
            <h2>${escapeHtml(reservation.nickname)}さん｜${escapeHtml(serviceLabels[reservation.service] || reservation.service)}</h2>
            <dl class="reservation-meta">
              <div><dt>メール</dt><dd>${escapeHtml(reservation.email)}</dd></div>
              <div><dt>区分・料金</dt><dd>${escapeHtml(customerLabels[reservation.customer_type])}・${Number(reservation.amount).toLocaleString('ja-JP')}円</dd></div>
              <div><dt>第1希望</dt><dd>${escapeHtml(reservation.preferred_date)} ${escapeHtml(reservation.preferred_time)}</dd></div>
              <div><dt>第2希望</dt><dd>${reservation.alternate_date ? `${escapeHtml(reservation.alternate_date)} ${escapeHtml(reservation.alternate_time)}` : 'なし'}</dd></div>
              <div><dt>支払い方法</dt><dd>${reservation.payment_method === 'bank' ? '銀行振込' : 'PayPay'}</dd></div>
              <div><dt>占い</dt><dd>${reservation.fortune_type ? escapeHtml(fortuneLabels[reservation.fortune_type]) : '—'}</dd></div>
            </dl>
            <div class="topic">${escapeHtml(reservation.topic || '相談テーマの記入なし')}</div>
          </div>
          <div class="editor">
            <div class="editor-row">
              <label>予約状態
                <select name="status">
                  ${Object.entries(statusLabels).map(([value,label]) => `<option value="${value}" ${reservation.status === value ? 'selected' : ''}>${label}</option>`).join('')}
                </select>
              </label>
              <label>入金状態
                <select name="paymentStatus">
                  ${Object.entries(paymentLabels).map(([value,label]) => `<option value="${value}" ${reservation.payment_status === value ? 'selected' : ''}>${label}</option>`).join('')}
                </select>
              </label>
            </div>
            <label>Google Meet URL
              <input name="meetingUrl" type="url" value="${escapeHtml(reservation.meeting_url || '')}" placeholder="https://meet.google.com/...">
            </label>
            <label>管理メモ
              <textarea name="adminNote" placeholder="入金日、変更履歴など">${escapeHtml(reservation.admin_note || '')}</textarea>
            </label>
            <div class="actions">
              <button class="button primary save-reservation" type="button">更新を保存</button>
              <a class="button" href="${paymentMailLink(reservation)}">支払い案内を作成</a>
              <a class="button" href="${mailLink(reservation)}">確定メールを作成</a>
              <a class="button" href="${reminderMailLink(reservation)}">前日メールを作成</a>
              <a class="button" href="${calendarLink(reservation)}" target="_blank" rel="noopener">カレンダー予定を作成</a>
            </div>
          </div>
        </article>
      `).join('');
    }

    async function loadReservations() {
      dashboardMessage.textContent = '読み込んでいます…';
      try {
        const status = document.getElementById('status-filter').value;
        const data = await api(`/api/admin/reservations${status ? `?status=${encodeURIComponent(status)}` : ''}`);
        renderReservations(data.reservations);
        dashboardMessage.textContent = '';
        loginPanel.hidden = true;
        dashboard.hidden = false;
        logout.hidden = false;
      } catch (error) {
        dashboardMessage.textContent = error.message;
        if (/認証/.test(error.message)) {
          sessionStorage.removeItem('hoshino_admin_token');
          adminToken = '';
          loginPanel.hidden = false;
          dashboard.hidden = true;
          logout.hidden = true;
        }
        throw error;
      }
    }

    document.getElementById('login-form').addEventListener('submit', async event => {
      event.preventDefault();
      loginMessage.textContent = '確認しています…';
      adminToken = document.getElementById('admin-token').value.trim();
      try {
        await loadReservations();
        sessionStorage.setItem('hoshino_admin_token', adminToken);
        loginMessage.textContent = '';
      } catch (error) {
        loginMessage.textContent = error.message;
      }
    });

    document.getElementById('refresh').addEventListener('click', () => loadReservations().catch(() => {}));
    document.getElementById('status-filter').addEventListener('change', () => loadReservations().catch(() => {}));
    logout.addEventListener('click', () => {
      sessionStorage.removeItem('hoshino_admin_token');
      adminToken = '';
      loginPanel.hidden = false;
      dashboard.hidden = true;
      logout.hidden = true;
      document.getElementById('admin-token').value = '';
    });

    list.addEventListener('click', async event => {
      const button = event.target.closest('.save-reservation');
      if (!button) return;
      const card = button.closest('.reservation-card');
      button.disabled = true;
      button.textContent = '保存中…';
      dashboardMessage.textContent = '';
      try {
        await api(`/api/admin/reservations/${encodeURIComponent(card.dataset.id)}`, {
          method: 'PATCH',
          body: JSON.stringify({
            status: card.querySelector('[name="status"]').value,
            paymentStatus: card.querySelector('[name="paymentStatus"]').value,
            meetingUrl: card.querySelector('[name="meetingUrl"]').value,
            adminNote: card.querySelector('[name="adminNote"]').value
          })
        });
        button.textContent = '保存しました';
        setTimeout(() => { button.textContent = '更新を保存'; }, 1600);
      } catch (error) {
        dashboardMessage.textContent = error.message;
        button.textContent = '更新を保存';
      } finally {
        button.disabled = false;
      }
    });

    if (adminToken) {
      loadReservations().catch(() => {});
    }
  </script>
</body>
</html>
